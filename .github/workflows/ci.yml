name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (bronze / silver / gold)
        run: pytest -q
      - name: Smoke test del pipeline local
        run: PYTHONPATH=src python -m payments_lake.pipeline demo --days 2 --batches-per-day 2 --batch-size 500

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, platform]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
